spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
logging.level.com.example.urlshortener=WARN
# Higher registration rate limit for tests (all tests share the same IP)
app.registration.max-per-hour=100
# Trusted proxy IP for tests (localhost/127.0.0.1 is trusted for test isolation)
app.trusted-proxy-ips=127.0.0.1,localhost
