# ==============================
# Database Configuration
# ==============================
# We use PostgreSQL as our primary database for storing URL mappings and click events.
# The choice of PostgreSQL over MySQL is due to its strong ACID compliance, advanced features,
# and suitability for write-heavy workloads (our click events will be frequent).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# Hibernate Configuration
# ==============================
# Hibernate DDL Auto (create-drop for development, update or validate for production)
# We set to 'validate' so that Hibernate validates the schema against the mapped entities.
# Schema migrations are managed by Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in console (for learning and debugging)
# This helps us see what Hibernate is generating, which is useful for understanding ORM.
spring.jpa.show-sql=true

# Format SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Redis Configuration
# ==============================
# Redis is used as a caching layer for URL redirects to improve read performance.
# We use Redis as an in-memory key-value store with TTL for cache expiration.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# We don't set a password for local development, but in production we would use a secure password.
# spring.redis.password=${SPRING_REDIS_PASSWORD:}

# ==============================
# RabbitMQ Configuration
# ==============================
# RabbitMQ is used for asynchronous click event processing.
# This decouples the redirect service from the analytics processing, improving response time and fault tolerance.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# RabbitMQ Exchange, Queue, and Routing Key for click events
urlshortener.exchange=urlshortener-exchange
urlshortener.queue.clickEvents=urlshortener-click-events
urlshortener.routingKey.clickEvents=urlshortener-routing-clickEvents

# ==============================
# Server Configuration
# ==============================
# The application runs on port 8080 by default.
# This can be overridden by the SERVER_PORT environment variable.
server.port=${SERVER_PORT:8080}

# ==============================
# Application Properties
# ==============================
# Base URL for the shortened links (used in responses)
# In production, this would be your actual domain.
app.base-url=http://localhost:8080

# ==============================
# Rate Limiting Configuration
# ==============================
# We use Redis for distributed rate limiting.
# The limits are defined in the RateLimiterConfig class.
# IP-based limit: 5 requests per minute
# API key-based limit: 100 requests per hour
rate.limit.ip.limit=5
rate.limit.ip.window-minutes=1
rate.limit.api-key.limit=100
rate.limit.api-key.window-hours=1

# ==============================
# Cache Configuration
# ==============================
# URL cache prefix and TTL (time-to-live) in seconds
url.cache.prefix=url:
url.cache.ttl=3600

# ==============================
# Security Configuration
# ==============================
# API key header names for authentication
app.api-key.access-header=X-Access-Key
app.api-key.secret-header=X-Secret-Key
# Legacy API key header (for rate limiting fallback)
app.api-key-header=X-API-Key

# ==============================
# Logging Configuration
# ==============================
# We set the logging level for Spring Boot and our application.
# This helps in debugging without being too verbose.
logging.level.org.springframework=INFO
logging.level.com.example.urlshortener=DEBUG
logging.level.org.springframework.security=DEBUG
