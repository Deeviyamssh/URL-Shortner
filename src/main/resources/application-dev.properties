# ==============================
# Development Configuration
# ==============================
# These settings are used when the active profile is 'dev'

# Database Configuration for development
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener_dev
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration for development
spring.data.redis.host=localhost
spring.data.redis.port=6379

# RabbitMQ Configuration for development
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Exchange, Queue, and Routing Key for click events
urlshortener.exchange=urlshortener-exchange
urlshortener.queue.clickEvents=urlshortener-click-events
urlshortener.routingKey.clickEvents=urlshortener-routing-clickEvents

# Server Configuration
server.port=8080

# Application Properties
app.base-url=http://localhost:8080

# Rate Limiting Configuration
rate.limit.ip.limit=5
rate.limit.ip.window-minutes=1
rate.limit.api-key.limit=100
rate.limit.api-key.window-hours=1

# Cache Configuration
url.cache.prefix=url:
url.cache.ttl=3600

# Security Configuration
app.api-key.access-header=X-Access-Key
app.api-key.secret-header=X-Secret-Key
app.api-key-header=X-API-Key

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.example.urlshortener=DEBUG
logging.level.org.springframework.security=DEBUG